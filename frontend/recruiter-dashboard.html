<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recruiter Dashboard — JobPortal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar">
  <div class="navbar-brand"><span class="dot"></span> JobPortal</div>
  <div class="navbar-links">
    <span id="navEmail" class="text-muted small-text"></span>
    <button class="logout-btn" onclick="logout()">Logout</button>
  </div>
</nav>

<div class="container-wide">

  <div class="dashboard-header page-header">
    <div>
      <h2>Recruiter Dashboard</h2>
      <p class="text-muted small-text" id="welcomeMsg">Welcome back!</p>
    </div>
  </div>

  <div class="stats">
    <div class="stat-card">
      <h3>Jobs Posted</h3>
      <div class="number" id="totalJobs">—</div>
    </div>
    <div class="stat-card">
      <h3>Total Applicants</h3>
      <div class="number" id="totalApplicants">—</div>
    </div>
  </div>

  <div class="dashboard-nav">
    <button class="tab-button active" onclick="switchTab(event,'posted-jobs')">Posted Jobs</button>
    <button class="tab-button" onclick="switchTab(event,'post-job')">Post New Job</button>
    <button class="tab-button" onclick="switchTab(event,'applicants')">Applicants</button>
  </div>

  <!-- Tab 1: Posted Jobs -->
  <div id="posted-jobs" class="tab-content active">
    <div class="section-heading dashboard-header">
      <div>
        <h2>Your Posted Jobs</h2>
        <p class="text-muted small-text">Manage and view your job listings</p>
      </div>
      <button onclick="loadRecruiterJobs()" class="btn-secondary">Refresh</button>
    </div>
    <div id="jobsList"></div>
  </div>

  <!-- Tab 2: Post New Job -->
  <div id="post-job" class="tab-content">
    <div class="section-heading">
      <h2>Post a New Job</h2>
      <p class="text-muted small-text">Fill in the details to publish a new listing</p>
    </div>
    <div class="dashboard-form">
      <div class="form-group">
        <label for="jobTitle">Job Title</label>
        <input id="jobTitle" type="text" placeholder="e.g., Senior Developer">
      </div>
      <div class="form-group">
        <label for="jobDescription">Job Description</label>
        <textarea id="jobDescription" placeholder="Describe the job responsibilities and requirements"></textarea>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="jobSalary">Annual Salary ($)</label>
          <input id="jobSalary" type="number" placeholder="e.g., 60000">
        </div>
        <div class="form-group">
          <label for="jobLocation">Location</label>
          <input id="jobLocation" type="text" placeholder="e.g., New York, NY">
        </div>
      </div>
      <div class="form-group">
        <label for="jobCompany">Company Name</label>
        <input id="jobCompany" type="text" placeholder="Your company name">
      </div>
      <button onclick="postJobFromDashboard()">Post Job</button>
    </div>
  </div>

  <!-- Tab 3: Applicants -->
  <div id="applicants" class="tab-content">
    <div class="section-heading dashboard-header">
      <div>
        <h2>Job Applicants</h2>
        <p class="text-muted small-text">Review and manage candidate applications</p>
      </div>
      <button onclick="loadApplicantsForRecruiter()" class="btn-secondary">Refresh</button>
    </div>
    <div id="applicantsList"></div>
  </div>

</div>

<!-- Edit Job Modal -->
<div id="editModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:200;display:none;align-items:center;justify-content:center;padding:20px;">
  <div style="background:var(--navy-2);border:1px solid var(--border-2);border-radius:var(--radius-xl);padding:36px;width:min(560px,100%);max-height:90vh;overflow-y:auto;">
    <h2 style="margin-bottom:24px;">Edit Job</h2>
    <input type="hidden" id="editJobId">
    <div class="form-group"><label>Job Title</label><input id="editTitle" type="text"></div>
    <div class="form-group"><label>Description</label><textarea id="editDescription"></textarea></div>
    <div class="form-row">
      <div class="form-group"><label>Salary ($)</label><input id="editSalary" type="number"></div>
      <div class="form-group"><label>Location</label><input id="editLocation" type="text"></div>
    </div>
    <div class="form-group"><label>Company</label><input id="editCompany" type="text"></div>
    <div style="display:flex;gap:12px;margin-top:8px;">
      <button onclick="saveEditJob()">Save Changes</button>
      <button class="btn-secondary" style="width:auto;" onclick="closeEditModal()">Cancel</button>
    </div>
  </div>
</div>

<script>
  const API = 'http://localhost:8080';

  document.addEventListener('DOMContentLoaded', function() {
    const email = sessionStorage.getItem('email');
    const role  = sessionStorage.getItem('role');
    if (!email || role !== 'RECRUITER') {
      alert('Please login as a recruiter.');
      window.location.href = 'login.html';
      return;
    }
    document.getElementById('navEmail').textContent = email;
    document.getElementById('welcomeMsg').textContent = 'Welcome back, ' + email;
    loadRecruiterJobs();
    loadApplicantsForRecruiter();
  });

  function switchTab(event, tabName) {
    document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-button').forEach(b => b.classList.remove('active'));
    document.getElementById(tabName).classList.add('active');
    event.target.classList.add('active');
  }

  /* ── Posted Jobs ── */
  function loadRecruiterJobs() {
    const email = sessionStorage.getItem('email');
    fetch(`${API}/recruiter-jobs?email=${encodeURIComponent(email)}`)
    .then(res => res.json())
    .then(data => {
      document.getElementById('totalJobs').textContent = data.length;
      if (!data.length) {
        document.getElementById('jobsList').innerHTML =
          `<div class="empty-state"><div class="empty-icon">📋</div><p>No jobs posted yet. Go to "Post New Job" to get started.</p></div>`;
        return;
      }
      document.getElementById('jobsList').innerHTML = data.map(job => `
        <div class="job-item">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px;">
            <div>
              <h3>${job.title}</h3>
              <p><span class="card-label">Company</span> ${job.company}</p>
              <p><span class="card-label">Location</span> ${job.location}</p>
              <p><span class="card-label">Description</span> ${job.description.substring(0,110)}...</p>
            </div>
            <div style="text-align:right;">
              <div class="salary-chip">$${parseFloat(job.salary).toLocaleString()}</div>
              <p style="font-size:0.8rem;color:var(--text-3);margin-top:6px;">${job.applicantCount} applicant${job.applicantCount == 1 ? '' : 's'}</p>
            </div>
          </div>
          <div class="job-item-footer">
            <button class="btn-ghost btn-sm" onclick="openEditModal(${job.id}, '${escStr(job.title)}', '${escStr(job.description)}', ${job.salary}, '${escStr(job.location)}', '${escStr(job.company)}')">Edit</button>
            <button class="btn-danger btn-sm" onclick="deleteJob(${job.id})">Delete</button>
          </div>
        </div>`).join('');
    })
    .catch(() => { document.getElementById('jobsList').innerHTML = '<p style="color:#fca5a5;">Error loading jobs.</p>'; });
  }

  function escStr(str) {
    return (str || '').replace(/'/g, "\\'").replace(/\n/g, ' ');
  }

  /* ── Post Job ── */
  function postJobFromDashboard() {
    const title       = document.getElementById('jobTitle').value.trim();
    const description = document.getElementById('jobDescription').value.trim();
    const salary      = document.getElementById('jobSalary').value.trim();
    const location    = document.getElementById('jobLocation').value.trim();
    const company     = document.getElementById('jobCompany').value.trim();
    const email       = sessionStorage.getItem('email');

    if (!title || !description || !salary || !location || !company) {
      alert('Please fill in all fields.'); return;
    }
    if (isNaN(salary) || Number(salary) <= 0) {
      alert('Please enter a valid salary.'); return;
    }

    fetch(`${API}/postjob`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: `title=${encodeURIComponent(title)}&description=${encodeURIComponent(description)}&salary=${salary}&location=${encodeURIComponent(location)}&company=${encodeURIComponent(company)}&email=${encodeURIComponent(email)}`
    })
    .then(res => res.text())
    .then(data => {
      if (data === 'Job Posted') {
        alert('Job posted successfully!');
        ['jobTitle','jobDescription','jobSalary','jobLocation','jobCompany'].forEach(id => document.getElementById(id).value = '');
        loadRecruiterJobs();
        // Switch to posted-jobs tab
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-button').forEach(b => b.classList.remove('active'));
        document.getElementById('posted-jobs').classList.add('active');
        document.querySelector('.tab-button').classList.add('active');
      } else {
        alert('Failed to post job.');
      }
    })
    .catch(() => alert('Failed to post job. Please try again.'));
  }

  /* ── Edit Job Modal ── */
  function openEditModal(id, title, description, salary, location, company) {
    document.getElementById('editJobId').value      = id;
    document.getElementById('editTitle').value      = title;
    document.getElementById('editDescription').value = description;
    document.getElementById('editSalary').value     = salary;
    document.getElementById('editLocation').value   = location;
    document.getElementById('editCompany').value    = company;
    document.getElementById('editModal').style.display = 'flex';
  }

  function closeEditModal() {
    document.getElementById('editModal').style.display = 'none';
  }

  function saveEditJob() {
    const jobId       = document.getElementById('editJobId').value;
    const title       = document.getElementById('editTitle').value.trim();
    const description = document.getElementById('editDescription').value.trim();
    const salary      = document.getElementById('editSalary').value.trim();
    const location    = document.getElementById('editLocation').value.trim();
    const company     = document.getElementById('editCompany').value.trim();
    const email       = sessionStorage.getItem('email');

    if (!title || !salary || !location || !company) { alert('Please fill in all fields.'); return; }

    fetch(`${API}/update-job`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: `jobId=${jobId}&title=${encodeURIComponent(title)}&description=${encodeURIComponent(description)}&salary=${salary}&location=${encodeURIComponent(location)}&company=${encodeURIComponent(company)}&email=${encodeURIComponent(email)}`
    })
    .then(res => res.text())
    .then(data => {
      if (data.includes('Updated') || data.includes('updated') || data.includes('success')) {
        closeEditModal();
        loadRecruiterJobs();
      } else {
        alert('Failed to update job.');
      }
    })
    .catch(() => alert('Failed to update job. Please try again.'));
  }

  // Close modal when clicking outside
  document.getElementById('editModal').addEventListener('click', function(e) {
    if (e.target === this) closeEditModal();
  });

  /* ── Delete Job ── */
  function deleteJob(jobId) {
    if (!confirm('Delete this job? This will also remove all applications for it.')) return;
    const email = sessionStorage.getItem('email');
    fetch(`${API}/delete-job`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: `jobId=${jobId}&email=${encodeURIComponent(email)}`
    })
    .then(res => res.text())
    .then(data => {
      if (data.includes('Deleted') || data.includes('deleted') || data.includes('success')) {
        loadRecruiterJobs();
      } else {
        alert('Failed to delete job.');
      }
    })
    .catch(() => alert('Failed to delete job.'));
  }

  /* ── Applicants ── */
  function loadApplicantsForRecruiter() {
    const email = sessionStorage.getItem('email');
    fetch(`${API}/recruiter-applicants?email=${encodeURIComponent(email)}`)
    .then(res => res.json())
    .then(data => {
      document.getElementById('totalApplicants').textContent = data.length;
      if (!data.length) {
        document.getElementById('applicantsList').innerHTML =
          `<div class="empty-state"><div class="empty-icon">👥</div><p>No applicants yet.</p></div>`;
        return;
      }
      document.getElementById('applicantsList').innerHTML = '<div class="grid">' +
        data.map(app => {
          const s = (app.status || 'pending').toLowerCase();
          const statusClass = s === 'accepted' ? 'status-accepted' : s === 'rejected' ? 'status-rejected' : 'status-pending';
          return `
            <div class="card">
              <p><span class="card-label">Candidate</span><br><strong style="color:var(--text-1);">${app.candidateName || app.email}</strong></p>
              <p><span class="card-label">Email</span><br>${app.email}</p>
              <p><span class="card-label">Position</span><br>${app.job}</p>
              <p><span class="card-label">Company</span><br>${app.company}</p>
              <p><span class="card-label">Applied</span><br>${new Date(app.appliedAt).toLocaleDateString()}</p>
              <p style="margin-top:10px;"><span class="status-badge ${statusClass}">${app.status || 'PENDING'}</span></p>
              <div style="display:flex;gap:8px;margin-top:14px;">
                <button class="btn-accept btn-sm" onclick="updateStatus(${app.id},'accepted')">Accept</button>
                <button class="btn-reject btn-sm" onclick="updateStatus(${app.id},'rejected')">Reject</button>
              </div>
            </div>`;
        }).join('') + '</div>';
    })
    .catch(() => { document.getElementById('applicantsList').innerHTML = '<p style="color:#fca5a5;">Error loading applicants.</p>'; });
  }

  function updateStatus(applicationId, status) {
    const label = status === 'accepted' ? 'accept' : 'reject';
    if (!confirm(`${label.charAt(0).toUpperCase() + label.slice(1)} this application?`)) return;
    const email = sessionStorage.getItem('email');
    fetch(`${API}/update-status`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: `applicationId=${applicationId}&status=${status}&email=${encodeURIComponent(email)}`
    })
    .then(res => res.text())
    .then(data => {
      if (data.includes('Updated') || data.includes('updated') || data.includes('success')) {
        loadApplicantsForRecruiter();
      } else {
        alert('Failed to update status.');
      }
    })
    .catch(() => alert('Failed to update status.'));
  }

  function logout() {
    sessionStorage.clear();
    window.location.href = 'login.html';
  }
</script>
</body>
</html>
