<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recruiter Dashboard — JobPortal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="layout">
  <nav class="sidebar" id="sidebar"></nav>
  <main class="main">

    <div class="topbar">
      <div class="topbar-left">
        <button class="mobile-menu-btn" id="mobileMenuBtn">☰</button>
        <div class="topbar-title">
          <h1 id="welcomeH">Recruiter Dashboard</h1>
          <p>Manage your listings and review candidates</p>
        </div>
      </div>
    </div>

    <!-- Stats -->
    <div class="stats-row" id="statsRow"></div>

    <!-- Charts -->
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:22px" id="chartsRow"></div>

    <!-- Tabs -->
    <div class="tabs">
      <button class="tab-btn active" onclick="sw(event,'posted-jobs')">Posted Jobs</button>
      <button class="tab-btn" onclick="sw(event,'post-new')">Post New Job</button>
      <button class="tab-btn" onclick="sw(event,'applicants')">Applicants</button>
    </div>

    <!-- Posted Jobs -->
    <div id="posted-jobs" class="tab-pane active">
      <div class="section-head">
        <div><h2>Your Listings</h2><p>All jobs you have published</p></div>
        <button class="btn-secondary btn-sm" onclick="loadMyJobs()">↺ Refresh</button>
      </div>
      <div id="jobsList"></div>
    </div>

    <!-- Post New -->
    <div id="post-new" class="tab-pane">
      <div class="section-head mb-4">
        <div><h2>Post a New Job</h2><p>Fill in the details to publish a listing</p></div>
      </div>
      <div class="form-card">
        <div class="form-group"><label>Job Title</label><input type="text" id="jobTitle" placeholder="e.g. Senior Developer"></div>
        <div class="form-group"><label>Job Description</label><textarea id="jobDescription" placeholder="Responsibilities, requirements, benefits…"></textarea></div>
        <div class="form-row">
          <div class="form-group"><label>Annual Salary (৳)</label><input type="number" id="jobSalary" placeholder="e.g. 80000"></div>
          <div class="form-group"><label>Location</label><input type="text" id="jobLocation" placeholder="e.g. Dhaka"></div>
        </div>
        <div class="form-group"><label>Company Name</label><input type="text" id="jobCompany" placeholder="Your company name"></div>
        <button onclick="submitJob()" class="w-full">Publish Listing</button>
      </div>
    </div>

    <!-- Applicants -->
    <div id="applicants" class="tab-pane">
      <div class="section-head">
        <div><h2>All Applicants</h2><p>Review and decide on candidate applications</p></div>
        <button class="btn-secondary btn-sm" onclick="loadApps()">↺ Refresh</button>
      </div>
      <div id="appsList"></div>
    </div>
  </main>
</div>

<!-- Edit Modal -->
<div id="editModal" class="modal-overlay">
  <div class="modal">
    <h3>Edit Job Listing</h3>
    <input type="hidden" id="editId">
    <div class="form-group"><label>Job Title</label><input type="text" id="editTitle"></div>
    <div class="form-group"><label>Description</label><textarea id="editDesc"></textarea></div>
    <div class="form-row">
      <div class="form-group"><label>Salary (৳)</label><input type="number" id="editSalary"></div>
      <div class="form-group"><label>Location</label><input type="text" id="editLocation"></div>
    </div>
    <div class="form-group"><label>Company</label><input type="text" id="editCompany"></div>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeModal()">Cancel</button>
      <button onclick="saveEdit()">Save Changes</button>
    </div>
  </div>
</div>

<script src="script.js"></script>
<script>
  const _u=getUser();
  if(!_u.email||_u.role!=='RECRUITER') location.href='login.html';

  document.addEventListener('DOMContentLoaded',()=>{
    buildSidebar('dashboard');
    document.getElementById('welcomeH').textContent=`Welcome, ${(_u.name||_u.email).split(' ')[0]}!`;
    loadDashboard();
  });

  /* ── Tab ── */
  function sw(e,id){
    document.querySelectorAll('.tab-pane').forEach(p=>p.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    e.currentTarget.classList.add('active');
    if(id==='posted-jobs') loadMyJobs();
    if(id==='applicants')  loadApps();
  }

  /* ── Dashboard data ── */
  function loadDashboard(){
    Promise.all([
      apiFetch(`/recruiter-jobs?email=${enc(_u.email)}`).then(r=>r.ok?r.json():[]),
      apiFetch(`/applicants?email=${enc(_u.email)}`).then(r=>r.ok?r.json():[])
    ]).then(([jobs,apps])=>{
      renderStats(jobs,apps);
      renderCharts(jobs,apps);
      renderJobs(jobs);
    }).catch(()=>{});
  }

  function renderStats(jobs,apps){
    const pend=apps.filter(a=>(a.status||'').toLowerCase()==='pending').length;
    const acc =apps.filter(a=>(a.status||'').toLowerCase()==='accepted').length;
    document.getElementById('statsRow').innerHTML=`
      <div class="stat-card gold">
        <div class="stat-label">Jobs Posted</div>
        <div class="stat-num">${jobs.length}</div>
        <div class="stat-sub">Active listings</div>
      </div>
      <div class="stat-card dark">
        <div class="stat-label">Total Applicants</div>
        <div class="stat-num">${apps.length}</div>
        <div class="stat-sub">Across all listings</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Pending Review</div>
        <div class="stat-num" style="color:var(--amber)">${pend}</div>
        <div class="stat-sub">Awaiting decision</div>
        ${pend>0?'<span class="stat-trend down">! Needs action</span>':''}
      </div>
      <div class="stat-card">
        <div class="stat-label">Accepted</div>
        <div class="stat-num" style="color:var(--green)">${acc}</div>
        <div class="stat-sub">Hired candidates</div>
        ${acc>0?'<span class="stat-trend up">✓ Great</span>':''}
      </div>`;
  }

  function renderCharts(jobs,apps){
    const pend=apps.filter(a=>(a.status||'').toLowerCase()==='pending').length;
    const acc =apps.filter(a=>(a.status||'').toLowerCase()==='accepted').length;
    const rej =apps.filter(a=>(a.status||'').toLowerCase()==='rejected').length;
    const mx  =Math.max(1,pend,acc,rej);

    const topJobs=jobs.map(j=>({...j,cnt:Number(j.applicantCount||0)}))
      .filter(j=>j.cnt>0).sort((a,b)=>b.cnt-a.cnt).slice(0,4);
    const topMx=topJobs.length?topJobs[0].cnt:1;

    document.getElementById('chartsRow').innerHTML=`
      <div class="panel">
        <h3>Applicant Status</h3>
        <div class="status-bar-row"><span class="status-bar-label">Pending</span><span class="status-bar-count">${pend}</span><div class="status-bar-track"><div class="status-bar-fill fill-amber" style="width:${Math.round(pend/mx*100)}%"></div></div></div>
        <div class="status-bar-row"><span class="status-bar-label">Accepted</span><span class="status-bar-count">${acc}</span><div class="status-bar-track"><div class="status-bar-fill fill-green" style="width:${Math.round(acc/mx*100)}%"></div></div></div>
        <div class="status-bar-row"><span class="status-bar-label">Rejected</span><span class="status-bar-count">${rej}</span><div class="status-bar-track"><div class="status-bar-fill fill-red" style="width:${Math.round(rej/mx*100)}%"></div></div></div>
      </div>
      <div class="panel">
        <h3>Top Performing Listings</h3>
        ${topJobs.length?topJobs.map((j,i)=>`
          <div class="perf-row">
            <div class="perf-rank">#${i+1}</div>
            <div class="perf-info">
              <h4>${esc(j.title)}</h4>
              <p>${esc(j.company)} · ${esc(j.location)}</p>
            </div>
            <div>
              <div class="perf-count">${j.cnt} applicant${j.cnt===1?'':'s'}</div>
              <div class="perf-bar"><div class="perf-bar-fill" style="width:${Math.round(j.cnt/topMx*100)}%"></div></div>
            </div>
          </div>`).join('')
        :`<p class="text-sm text-muted">Post jobs to see performance data.</p>`}
      </div>`;
  }

  /* ── Posted Jobs ── */
  function loadMyJobs(){
    const c=document.getElementById('jobsList'); showSkeleton(c,4);
    apiFetch(`/recruiter-jobs?email=${enc(_u.email)}`).then(r=>r.json()).then(data=>{
      if(!data.length){c.innerHTML=empty('📋','No jobs posted yet. Use "Post New Job" tab.');return;}
      c.innerHTML=data.map(j=>`
        <div class="card" style="margin-bottom:12px">
          <div class="flex-between">
            <div style="flex:1;min-width:0">
              <div class="job-card-title">${esc(j.title)}</div>
              <div class="job-card-company" style="margin-top:2px">${esc(j.company)} · ${esc(j.location)}</div>
            </div>
            <div style="text-align:right;flex-shrink:0">
              <span class="chip chip-gold">৳${parseFloat(j.salary).toLocaleString()}</span>
              <p class="text-sm text-muted" style="margin-top:5px">${j.applicantCount||0} applicant${j.applicantCount==1?'':'s'}</p>
            </div>
          </div>
          <p class="text-sm text-muted" style="margin:10px 0;line-height:1.55">${esc((j.description||'').substring(0,130))}…</p>
          <div class="flex" style="border-top:1px solid var(--border);padding-top:12px">
            <button class="btn-ghost btn-sm" onclick="openEdit(${j.id},'${es(j.title)}','${es(j.description)}',${j.salary},'${es(j.location)}','${es(j.company)}')">Edit</button>
            <button class="btn-danger btn-sm" onclick="deleteJob(${j.id})">Delete</button>
          </div>
        </div>`).join('');
    }).catch(()=>{c.innerHTML=empty('⚠️','Error loading jobs.');});
  }

  const es=s=>(s||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\n/g,' ');

  /* ── Submit Job ── */
  function submitJob(){
    const title=v('jobTitle'),desc=v('jobDescription'),salary=v('jobSalary'),loc=v('jobLocation'),comp=v('jobCompany');
    if(!title||!desc||!salary||!loc||!comp)return toast('Please fill in all fields.','error');
    if(isNaN(salary)||Number(salary)<=0)return toast('Enter a valid salary.','error');
    apiFetch('/postjob',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},
      body:`title=${enc(title)}&description=${enc(desc)}&salary=${salary}&location=${enc(loc)}&company=${enc(comp)}&email=${enc(_u.email)}`})
    .then(parseResp).then(d=>{
      toast(d?.message||d?.error||'Failed.',d?.message?'success':'error');
      if(d?.message){['jobTitle','jobDescription','jobSalary','jobLocation','jobCompany'].forEach(id=>{const e=document.getElementById(id);if(e)e.value='';});loadDashboard();}
    }).catch(()=>toast('Failed.','error'));
  }

  /* ── Applicants ── */
  function loadApps(){
    const c=document.getElementById('appsList'); showSkeleton(c,4);
    apiFetch(`/applicants?email=${enc(_u.email)}`).then(r=>r.json()).then(data=>{
      if(!data.length){c.innerHTML=empty('👥','No applicants yet.');return;}
      c.innerHTML=`<div class="grid-3">${data.map(a=>{
        const s=(a.status||'pending').toLowerCase();
        return `<div class="card">
          <div class="text-sm text-muted" style="margin-bottom:3px;font-size:.67rem;text-transform:uppercase;letter-spacing:.06em">Candidate</div>
          <strong style="display:block;margin-bottom:1px">${esc(a.candidateName||a.email)}</strong>
          <div class="text-sm text-muted" style="margin-bottom:12px">${esc(a.email)}</div>
          <hr class="divider">
          <div class="text-sm"><span class="text-muted">Position</span><br><strong>${esc(a.job)}</strong></div>
          <div class="text-sm mt-3"><span class="text-muted">Company</span><br>${esc(a.company)}</div>
          <div class="flex-between mt-4" style="border-top:1px solid var(--border);padding-top:12px">
            <span class="badge badge-${s}">${a.status||'PENDING'}</span>
            <span class="text-sm text-muted">${new Date(a.appliedAt).toLocaleDateString()}</span>
          </div>
          <div class="flex mt-3">
            <button class="btn-success btn-sm" onclick="upStatus(${a.id},'accepted')">Accept</button>
            <button class="btn-danger btn-sm"  onclick="upStatus(${a.id},'rejected')">Reject</button>
          </div>
        </div>`;
      }).join('')}</div>`;
    }).catch(()=>{c.innerHTML=empty('⚠️','Error.');});
  }

  function upStatus(id,status){
    if(!confirm(`${status==='accepted'?'Accept':'Reject'} this application?`))return;
    apiFetch('/update-status',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},
      body:`applicationId=${id}&status=${status}&email=${enc(_u.email)}`})
    .then(parseResp).then(d=>{if(d?.message){loadApps();loadDashboard();}else toast(d?.error||'Failed.','error');})
    .catch(()=>toast('Failed.','error'));
  }

  /* ── Edit Modal ── */
  function openEdit(id,title,desc,salary,loc,comp){
    document.getElementById('editId').value      =id;
    document.getElementById('editTitle').value   =title;
    document.getElementById('editDesc').value    =desc;
    document.getElementById('editSalary').value  =salary;
    document.getElementById('editLocation').value=loc;
    document.getElementById('editCompany').value =comp;
    document.getElementById('editModal').classList.add('open');
  }
  function closeModal(){document.getElementById('editModal').classList.remove('open');}
  document.getElementById('editModal').addEventListener('click',e=>{if(e.target===e.currentTarget)closeModal();});
  document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});

  function saveEdit(){
    const id=document.getElementById('editId').value,
          title=v('editTitle'),desc=v('editDesc'),salary=v('editSalary'),
          loc=v('editLocation'),comp=v('editCompany');
    if(!title||!salary||!loc||!comp)return toast('Fill all fields.','error');
    apiFetch('/update-job',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},
      body:`jobId=${id}&title=${enc(title)}&description=${enc(desc)}&salary=${salary}&location=${enc(loc)}&company=${enc(comp)}&email=${enc(_u.email)}`})
    .then(parseResp).then(d=>{if(d?.message){closeModal();loadMyJobs();loadDashboard();}else toast(d?.error||'Failed.','error');})
    .catch(()=>toast('Failed.','error'));
  }

  function deleteJob(id){
    if(!confirm('Delete this job and all its applications?'))return;
    apiFetch('/delete-job',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:`jobId=${id}&email=${enc(_u.email)}`})
      .then(parseResp).then(d=>{if(d?.message){loadMyJobs();loadDashboard();}else toast(d?.error||'Failed.','error');})
      .catch(()=>toast('Failed.','error'));
  }
</script>
</body>
</html>
