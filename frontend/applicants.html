<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Applicants — JobPortal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar">
  <div class="navbar-brand"><span class="dot"></span> JobPortal</div>
  <button id="navbarToggle" class="navbar-toggle" aria-label="Open navigation">
    <span></span><span></span><span></span>
  </button>
  <div class="navbar-links" id="navLinks"></div>
</nav>

<div class="container-wide">
  <div class="top-strip">
    <p>Search the latest jobs in Bangladesh and apply with a single click.</p>
    <div class="top-strip-links">
      <a href="login.html">Login</a>
      <a href="register.html">Register</a>
    </div>
  </div>

  <div class="page-header dashboard-header">
    <div>
      <h2>Job Applicants</h2>
      <p class="text-muted small-text">All candidates who have applied for your listings</p>
    </div>
    <button onclick="loadApplicants()" class="btn-secondary">Refresh</button>
  </div>

  <div id="list">
    <div class="loading-spinner"><div class="spinner"></div><p>Loading applicants…</p></div>
  </div>
</div>

<script src="script.js"></script>
<script>
  window.addEventListener('load', loadApplicants);
</script>
</body>
</html>
