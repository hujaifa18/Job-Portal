<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Job Applicants — JobPortal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar">
  <div class="navbar-brand"><span class="dot"></span> JobPortal</div>
  <div class="navbar-links" id="navLinks">
    <a href="index.html">Home</a>
    <a href="jobs.html">Browse Jobs</a>
    <a href="login.html" class="btn-nav-cta">Login</a>
  </div>
</nav>

<div class="container-wide">
  <div class="page-header dashboard-header">
    <div>
      <h2>Job Applicants</h2>
      <p class="text-muted small-text">All candidates who have applied</p>
    </div>
    <button onclick="loadApplicants()" class="btn-secondary">Refresh</button>
  </div>

  <div id="list">
    <div class="empty-state">
      <div class="empty-icon">👤</div>
      <p>Loading applicants...</p>
    </div>
  </div>
</div>

<script src="script.js"></script>
<script>
  const email = sessionStorage.getItem('email');
  const role  = sessionStorage.getItem('role');
  const nav   = document.getElementById('navLinks');
  if (email && role) {
    const dest = role === 'RECRUITER' ? 'recruiter-dashboard.html' : 'candidate-dashboard.html';
    nav.innerHTML = `
      <a href="index.html">Home</a>
      <a href="${dest}">Dashboard</a>
      <span class="text-muted small-text">${email}</span>
      <button class="logout-btn" onclick="logout()">Logout</button>`;
  }
  window.addEventListener('load', loadApplicants);
</script>
</body>
</html>
