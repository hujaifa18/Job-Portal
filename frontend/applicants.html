<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Applicants — JobPortal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="layout">
  <nav class="sidebar" id="sidebar"></nav>
  <main class="main">
    <div class="topbar">
      <div class="topbar-left">
        <button class="mobile-menu-btn" id="mobileMenuBtn">☰</button>
        <div class="topbar-title">
          <h1>Job Applicants</h1>
          <p>All candidates who applied to your listings</p>
        </div>
      </div>
      <div class="topbar-actions">
        <button class="btn-secondary btn-sm" onclick="loadApplicants()">↺ Refresh</button>
      </div>
    </div>
    <div id="list"></div>
  </main>
</div>
<script src="script.js"></script>
<script>
  buildSidebar('applicants');
  window.addEventListener('load',loadApplicants);
</script>
</body>
</html>
