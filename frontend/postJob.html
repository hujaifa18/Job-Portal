<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Post a Job — JobPortal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar">
  <div class="navbar-brand"><span class="dot"></span> JobPortal</div>
  <button id="navbarToggle" class="navbar-toggle" aria-label="Open navigation">
    <span></span><span></span><span></span>
  </button>
  <div class="navbar-links" id="navLinks"></div>
</nav>

<div class="container">
  <div class="top-strip">
    <p>Search the latest jobs in Bangladesh.</p>
    <div class="top-strip-links">
      <a href="login.html">Login</a>
      <a href="register.html">Register</a>
    </div>
  </div>

  <div class="section-heading">
    <h2>Post a New Job</h2>
    <p class="text-muted small-text">Fill in the details below to publish your job listing</p>
  </div>

  <div class="form-group">
    <label for="title">Job Title</label>
    <input id="title" type="text" placeholder="e.g., Senior React Developer">
  </div>

  <div class="form-group">
    <label for="description">Job Description</label>
    <textarea id="description" placeholder="Describe responsibilities, requirements, and benefits…"></textarea>
  </div>

  <div class="form-row">
    <div class="form-group">
      <label for="salary">Annual Salary (৳)</label>
      <input id="salary" type="number" placeholder="e.g., 80000">
    </div>
    <div class="form-group">
      <label for="location">Location</label>
      <input id="location" type="text" placeholder="e.g., Dhaka">
    </div>
  </div>

  <div class="form-group">
    <label for="company">Company Name</label>
    <input id="company" type="text" placeholder="Your company name">
  </div>

  <!-- BUG FIX: Hidden email field — auto-filled from session. Only shown if not logged in. -->
  <div class="form-group" id="emailGroup" style="display:none;">
    <label for="email">Recruiter Email</label>
    <input id="email" type="email" placeholder="recruiter@company.com">
  </div>

  <button onclick="postJob()" style="width:100%;">Post Job Listing</button>
</div>

<script src="script.js"></script>
<script>
  const _email = sessionStorage.getItem('email');
  const _role  = sessionStorage.getItem('role');

  if (_email && _role === 'RECRUITER') {
    document.getElementById('email').value = _email;
  } else if (_email && _role === 'CANDIDATE') {
    showAlert('Only recruiters can post jobs.');
    window.location.href = 'candidate-dashboard.html';
  } else {
    document.getElementById('emailGroup').style.display = 'block';
  }
</script>
</body>
</html>
