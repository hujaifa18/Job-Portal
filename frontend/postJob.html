<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Post a Job — JobPortal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="layout">
  <nav class="sidebar" id="sidebar"></nav>
  <main class="main">
    <div class="topbar">
      <div class="topbar-left">
        <button class="mobile-menu-btn" id="mobileMenuBtn">☰</button>
        <div class="topbar-title">
          <h1>Post a New Job</h1>
          <p>Publish your listing and reach thousands of candidates</p>
        </div>
      </div>
    </div>
    <div class="form-card">
      <div class="form-group">
        <label>Job Title</label>
        <input type="text" id="title" placeholder="e.g. Senior React Developer">
      </div>
      <div class="form-group">
        <label>Job Description</label>
        <textarea id="description" placeholder="Responsibilities, requirements, benefits…"></textarea>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Annual Salary (৳)</label>
          <input type="number" id="salary" placeholder="e.g. 80000">
        </div>
        <div class="form-group">
          <label>Location</label>
          <input type="text" id="location" placeholder="e.g. Dhaka">
        </div>
      </div>
      <div class="form-group">
        <label>Company Name</label>
        <input type="text" id="company" placeholder="Your company name">
      </div>
      <div class="form-group" id="emailGroup" style="display:none">
        <label>Recruiter Email</label>
        <input type="email" id="email" placeholder="recruiter@company.com">
      </div>
      <button onclick="postJob()" class="w-full">Publish Listing</button>
    </div>
  </main>
</div>
<script src="script.js"></script>
<script>
  buildSidebar('postjob');
  const _u=getUser();
  if(_u.email&&_u.role==='CANDIDATE'){toast('Only recruiters can post jobs.','error');setTimeout(()=>location.href='candidate-dashboard.html',1100);}
  else if(!_u.email) document.getElementById('emailGroup').style.display='block';
</script>
</body>
</html>
