<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — JobPortal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="layout">
  <nav class="sidebar" id="sidebar"></nav>
  <main class="main">

    <div class="topbar">
      <div class="topbar-left">
        <button class="mobile-menu-btn" id="mobileMenuBtn">☰</button>
        <div class="topbar-title">
          <h1 id="welcomeH">Dashboard</h1>
          <p>Track your applications and discover new opportunities</p>
        </div>
      </div>
    </div>

    <!-- Stats -->
    <div class="stats-row" id="statsRow"></div>

    <!-- Tabs -->
    <div class="tabs">
      <button class="tab-btn active" onclick="sw(event,'find-jobs')">Find Jobs</button>
      <button class="tab-btn" onclick="sw(event,'applications')">My Applications</button>
      <button class="tab-btn" onclick="sw(event,'resume-tab')">Resume</button>
    </div>

    <!-- Find Jobs -->
    <div id="find-jobs" class="tab-pane active">
      <div class="filter-bar" style="margin-bottom:18px">
        <input type="text"   id="searchKeyword"   placeholder="Title, skill or company…">
        <input type="text"   id="filterLocation"  placeholder="Location">
        <input type="number" id="filterMinSalary" placeholder="Min salary (৳)">
        <input type="number" id="filterMaxSalary" placeholder="Max salary (৳)">
        <div class="filter-actions" style="grid-column:1/-1">
          <button onclick="doSearch()">Search</button>
          <button class="btn-secondary" onclick="resetAndLoad()">Reset</button>
        </div>
      </div>
      <div id="jobsList"></div>
    </div>

    <!-- Applications -->
    <div id="applications" class="tab-pane">
      <div class="section-head">
        <div><h2>My Applications</h2><p>Status of every application you submitted</p></div>
        <button class="btn-secondary btn-sm" onclick="loadApps()">↺ Refresh</button>
      </div>
      <div id="appsList"></div>
    </div>

    <!-- Resume -->
    <div id="resume-tab" class="tab-pane">
      <div class="section-head mb-4">
        <div><h2>My Resume</h2><p>Upload and manage your CV files</p></div>
        <button class="btn-secondary btn-sm" onclick="loadRes()">↺ Refresh</button>
      </div>
      <div class="upload-zone" id="uploadZone" onclick="document.getElementById('fileInput').click()">
        <div class="upload-zone-icon">📤</div>
        <p style="font-weight:600;margin-bottom:4px;color:var(--t1)">Click to upload or drag & drop</p>
        <p class="text-sm text-muted">PDF only · Max 5MB</p>
        <input type="file" id="fileInput" accept=".pdf" style="display:none">
      </div>
      <div id="resList"></div>
    </div>
  </main>
</div>

<script src="script.js"></script>
<script>
  const _u=getUser();
  if(!_u.email||_u.role!=='CANDIDATE') location.href='login.html';

  document.addEventListener('DOMContentLoaded',()=>{
    buildSidebar('dashboard');
    document.getElementById('welcomeH').textContent=`Welcome back, ${(_u.name||_u.email).split(' ')[0]}!`;
    loadStats(); loadAllJobs(); setupUpload();
  });

  /* ── Tab switcher ── */
  function sw(e,id){
    document.querySelectorAll('.tab-pane').forEach(p=>p.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    e.currentTarget.classList.add('active');
    if(id==='applications') loadApps();
    if(id==='resume-tab')   loadRes();
  }

  /* ── Stats ── */
  function loadStats(){
    Promise.all([
      apiFetch(`/my-applications?email=${enc(_u.email)}`).then(r=>r.ok?r.json():[]),
      apiFetch(`/resumes?email=${enc(_u.email)}`).then(r=>r.ok?r.json():[])
    ]).then(([apps,resumes])=>{
      const pend=apps.filter(a=>(a.status||'').toLowerCase()==='pending').length;
      const acc =apps.filter(a=>(a.status||'').toLowerCase()==='accepted').length;
      document.getElementById('statsRow').innerHTML=`
        <div class="stat-card gold">
          <div class="stat-label">Total Applied</div>
          <div class="stat-num">${apps.length}</div>
          <div class="stat-sub">Applications submitted</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Pending</div>
          <div class="stat-num" style="color:var(--amber)">${pend}</div>
          <div class="stat-sub">Awaiting response</div>
          ${pend>0?'<span class="stat-trend up">↑ Active</span>':''}
        </div>
        <div class="stat-card">
          <div class="stat-label">Accepted</div>
          <div class="stat-num" style="color:var(--green)">${acc}</div>
          <div class="stat-sub">Successful applications</div>
          ${acc>0?'<span class="stat-trend up">✓ Hired</span>':''}
        </div>
        <div class="stat-card dark">
          <div class="stat-label">Resumes</div>
          <div class="stat-num">${resumes.length}</div>
          <div class="stat-sub">Files uploaded</div>
        </div>`;
    }).catch(()=>{});
  }

  /* ── Jobs ── */
  function loadAllJobs(){
    const c=document.getElementById('jobsList'); showSkeleton(c,6);
    apiFetch('/jobs').then(r=>r.json()).then(data=>{
      if(!data.length){c.innerHTML=empty('💼','No jobs found.');return;}
      c.innerHTML=`<div class="grid-3">${data.map(jobCardWithApply).join('')}</div>`;
    }).catch(()=>{c.innerHTML=empty('⚠️','Start the backend to see jobs.');});
  }

  function doSearch(){
    const c=document.getElementById('jobsList'); showSkeleton(c,6);
    const q=new URLSearchParams();
    const kw=v('searchKeyword'),loc=v('filterLocation'),mn=v('filterMinSalary'),mx=v('filterMaxSalary');
    if(kw)q.append('keyword',kw);if(loc)q.append('location',loc);
    if(mn)q.append('minSalary',mn);if(mx)q.append('maxSalary',mx);
    apiFetch([...q].length?`/search?${q}`:'/jobs').then(r=>r.json()).then(data=>{
      if(!data.length){c.innerHTML=empty('💼','No jobs found.');return;}
      c.innerHTML=`<div class="grid-3">${data.map(jobCardWithApply).join('')}</div>`;
    }).catch(()=>{c.innerHTML=empty('⚠️','Error.');});
  }

  function resetAndLoad(){
    ['searchKeyword','filterLocation','filterMinSalary','filterMaxSalary'].forEach(id=>{const e=document.getElementById(id);if(e)e.value='';});
    loadAllJobs();
  }

  function jobCardWithApply(job){
    const salary=parseFloat(job.salary||0).toLocaleString();
    return `<div class="job-card">
      <div class="job-card-head">
        <div>
          <div class="job-card-title">${esc(job.title)}</div>
          <div class="job-card-company">${esc(job.company)}</div>
        </div>
        <span class="chip chip-gold">৳${salary}</span>
      </div>
      <div class="job-card-meta">
        <span class="chip chip-gray">📍 ${esc(job.location)}</span>
        <span class="chip chip-teal">Full-time</span>
      </div>
      <p class="text-sm text-muted" style="line-height:1.55">${esc((job.description||'').substring(0,110))}…</p>
      <div class="job-card-footer">
        <span class="text-muted text-sm">${job.applicantCount||0} applicant${job.applicantCount==1?'':'s'}</span>
        <button class="btn-sm" onclick="quickApply(${job.id})">Apply Now</button>
      </div>
    </div>`;
  }

  function quickApply(jobId){
    apiFetch('/apply',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:`jobId=${jobId}&email=${enc(_u.email)}`})
      .then(parseResp).then(d=>{toast(d?.message||d?.error||'Failed.',d?.message?'success':'error');if(d?.message)loadStats();})
      .catch(()=>toast('Failed.','error'));
  }

  /* ── Applications ── */
  function loadApps(){
    const c=document.getElementById('appsList'); showLoading(c);
    apiFetch(`/my-applications?email=${enc(_u.email)}`).then(r=>r.json()).then(data=>{
      if(!data.length){c.innerHTML=empty('📋','No applications yet. Browse jobs and apply!');return;}
      c.innerHTML=data.map(a=>{
        const s=(a.status||'pending').toLowerCase();
        return `<div class="app-row">
          <div class="app-row-info">
            <h3>${esc(a.job)}</h3>
            <p>${esc(a.company)} · Applied ${new Date(a.appliedAt).toLocaleDateString()}</p>
          </div>
          <div class="app-row-right">
            <span class="badge badge-${s}">${a.status||'PENDING'}</span>
            <button class="btn-ghost btn-sm" onclick="withdraw(${a.id})">Withdraw</button>
          </div>
        </div>`;
      }).join('');
    }).catch(()=>{c.innerHTML=empty('⚠️','Error loading applications.');});
  }

  function withdraw(id){
    if(!confirm('Withdraw this application?'))return;
    apiFetch('/withdraw',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:`applicationId=${id}&email=${enc(_u.email)}`})
      .then(parseResp).then(d=>{if(d?.message){loadApps();loadStats();}else toast(d?.error||'Failed.','error');}).catch(()=>toast('Failed.','error'));
  }

  /* ── Resume tab ── */
  function setupUpload(){
    const zone=document.getElementById('uploadZone');
    const inp =document.getElementById('fileInput');
    if(!zone||!inp)return;
    inp.addEventListener('change',()=>{if(inp.files[0])doUpload(inp.files[0]);});
    zone.addEventListener('dragover',e=>{e.preventDefault();zone.style.borderColor='var(--gold)';});
    zone.addEventListener('dragleave',()=>zone.style.borderColor='');
    zone.addEventListener('drop',e=>{e.preventDefault();zone.style.borderColor='';if(e.dataTransfer.files[0])doUpload(e.dataTransfer.files[0]);});
  }

  function doUpload(file){
    if(!file.name.toLowerCase().endsWith('.pdf'))return toast('PDF only.','error');
    if(file.size>5*1024*1024)return toast('Max 5MB.','error');
    const fd=new FormData(); fd.append('email',_u.email); fd.append('file',file);
    apiFetch('/upload-resume',{method:'POST',body:fd}).then(parseResp)
      .then(d=>{toast(d?.message||d?.error||'Failed.',d?.message?'success':'error');if(d?.message){document.getElementById('fileInput').value='';loadRes();loadStats();}})
      .catch(()=>toast('Upload failed.','error'));
  }

  function loadRes(){
    const c=document.getElementById('resList'); if(!c)return;
    showLoading(c);
    apiFetch(`/resumes?email=${enc(_u.email)}`).then(parseResp).then(data=>{
      if(!data.length){c.innerHTML=empty('📄','No resumes yet.');return;}
      c.innerHTML=data.map(r=>`
        <div class="resume-row">
          <div class="resume-icon">📄</div>
          <div class="resume-info">
            <h3>${esc(r.fileName)} ${r.isPrimary?'<span class="badge badge-gold">Primary</span>':''}</h3>
            <p>${(r.fileSize/1024).toFixed(1)} KB · ${new Date(r.uploadedAt).toLocaleDateString()}</p>
          </div>
          <div class="resume-actions">
            <button class="btn-secondary btn-sm" onclick="apiUrl('/download-resume?id=${r.id}').then(u=>window.open(u,'_blank'))">Download</button>
            ${!r.isPrimary?`<button class="btn-ghost btn-sm" onclick="setPrim(${r.id})">Set Primary</button>`:''}
            <button class="btn-danger btn-sm" onclick="delR(${r.id})">Delete</button>
          </div>
        </div>`).join('');
    }).catch(()=>{c.innerHTML=empty('⚠️','Error.');});
  }

  function setPrim(id){
    apiFetch('/set-primary-resume',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:`resumeId=${id}&email=${enc(_u.email)}`})
      .then(parseResp).then(d=>{if(d?.message)loadRes();else toast(d?.error||'Failed.','error');});
  }
  function delR(id){
    if(!confirm('Delete?'))return;
    apiFetch('/delete-resume',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:`resumeId=${id}&email=${enc(_u.email)}`})
      .then(parseResp).then(d=>{if(d?.message){loadRes();loadStats();}else toast(d?.error||'Failed.','error');});
  }
</script>
</body>
</html>
