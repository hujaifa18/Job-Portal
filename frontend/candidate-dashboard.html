<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Candidate Dashboard — JobPortal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar">
  <div class="navbar-brand"><span class="dot"></span> JobPortal</div>
  <div class="navbar-links">
    <span id="navEmail" class="text-muted small-text"></span>
    <button class="logout-btn" onclick="logout()">Logout</button>
  </div>
</nav>

<div class="container-wide">

  <div class="dashboard-header page-header">
    <div>
      <h2>👤 Candidate Dashboard</h2>
      <p class="text-muted small-text" id="welcomeMsg">Welcome back!</p>
    </div>
  </div>

  <!-- Tabs -->
  <div class="dashboard-nav">
    <button class="tab-button active" onclick="switchTab(event,'find-jobs')">🔍 Find Jobs</button>
    <button class="tab-button" onclick="switchTab(event,'my-applications')">📋 My Applications</button>
    <button class="tab-button" onclick="switchTab(event,'my-resume')">📄 My Resume</button>
  </div>

  <!-- Tab 1: Find Jobs -->
  <div id="find-jobs" class="tab-content active">
    <div class="section-heading">
      <h2>Find Jobs</h2>
      <p class="text-muted small-text">Search and filter through available opportunities</p>
    </div>

    <div class="search-filter">
      <div class="search-filter-grid">
        <input type="text" id="searchKeyword" placeholder="🔍 Job title, skill, keyword...">
        <input type="text" id="filterLocation" placeholder="📍 Location">
        <input type="number" id="filterMinSalary" placeholder="Min Salary ($)">
        <input type="number" id="filterMaxSalary" placeholder="Max Salary ($)">
      </div>
      <div class="search-filter-actions">
        <button onclick="searchAndFilter()">🔍 Search</button>
        <button onclick="loadAllJobs()" class="btn-secondary">↺ Reset</button>
      </div>
    </div>

    <div id="jobsList"></div>
  </div>

  <!-- Tab 2: My Applications -->
  <div id="my-applications" class="tab-content">
    <div class="section-heading dashboard-header">
      <div>
        <h2>My Applications</h2>
        <p class="text-muted small-text">Track the status of your job applications</p>
      </div>
      <button onclick="loadMyApplications()" class="btn-secondary">🔄 Refresh</button>
    </div>
    <div id="applicationsList"></div>
  </div>

  <!-- Tab 3: My Resume -->
  <div id="my-resume" class="tab-content">
    <div class="section-heading">
      <h2>My Resume</h2>
      <p class="text-muted small-text">Upload and manage your resume files</p>
    </div>

    <div class="section-block">
      <h3>Upload New Resume</h3>
      <p class="text-muted small-text" style="margin-bottom:14px;">PDF only · Max 5MB</p>
      <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;">
        <input type="file" id="resumeFile" accept=".pdf,.doc,.docx" style="flex:1;min-width:200px;">
        <button onclick="uploadResume()" class="btn-secondary" style="width:auto;">📤 Upload</button>
      </div>
    </div>

    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">
      <h3>Uploaded Resumes</h3>
      <button onclick="loadMyResumes()" class="btn-secondary btn-sm">🔄 Refresh</button>
    </div>
    <div id="resumesList"></div>
  </div>

</div>

<script src="script.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', function() {
    const email = sessionStorage.getItem('email');
    const role  = sessionStorage.getItem('role');
    if (!email || role !== 'CANDIDATE') {
      alert('Please login as a candidate.');
      window.location.href = 'login.html';
      return;
    }
    document.getElementById('navEmail').textContent = email;
    document.getElementById('welcomeMsg').textContent = 'Welcome back, ' + email;
    loadAllJobs();
    loadMyApplications();
    loadMyResumes();
  });

  function switchTab(event, tabName) {
    document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-button').forEach(b => b.classList.remove('active'));
    document.getElementById(tabName).classList.add('active');
    event.target.classList.add('active');
  }

  function loadAllJobs() {
    document.getElementById('jobsList').innerHTML = '<p class="text-muted small-text">Loading jobs...</p>';
    fetch('http://localhost:8080/jobs')
    .then(res => res.json())
    .then(data => displayJobs(data))
    .catch(() => {
      document.getElementById('jobsList').innerHTML = '<p style="color:#fca5a5;">Error loading jobs.</p>';
    });
  }

  function searchAndFilter() {
    const keyword   = document.getElementById('searchKeyword').value;
    const location  = document.getElementById('filterLocation').value;
    const minSalary = document.getElementById('filterMinSalary').value;
    const maxSalary = document.getElementById('filterMaxSalary').value;

    let url = 'http://localhost:8080/search?';
    if (keyword)   url += `keyword=${encodeURIComponent(keyword)}&`;
    if (location)  url += `location=${encodeURIComponent(location)}&`;
    if (minSalary) url += `minSalary=${minSalary}&`;
    if (maxSalary) url += `maxSalary=${maxSalary}&`;
    url = url.replace(/&$/, '');

    fetch(url)
    .then(res => res.json())
    .then(data => displayJobs(data))
    .catch(() => {
      document.getElementById('jobsList').innerHTML = '<p style="color:#fca5a5;">Error searching jobs.</p>';
    });
  }

  function displayJobs(jobs) {
    if (jobs.length === 0) {
      document.getElementById('jobsList').innerHTML = `
        <div class="empty-state"><div class="empty-icon">🔍</div><p>No jobs found matching your criteria.</p></div>`;
      return;
    }
    let output = '<div class="grid">';
    jobs.forEach(job => {
      output += `
        <div class="card">
          <h3>${job.title}</h3>
          <p><span class="card-label">Company</span><br>${job.company}</p>
          <p><span class="card-label">Location</span><br>${job.location}</p>
          <p><span class="card-label">Description</span><br>${job.description.substring(0,120)}...</p>
          <div class="salary-chip">💰 $${parseFloat(job.salary).toLocaleString()} / yr</div>
          <div style="margin-top:16px;">
            <button onclick="applyJobFromDashboard(${job.id}, '${sessionStorage.getItem('email')}')">Apply Now →</button>
          </div>
        </div>`;
    });
    output += '</div>';
    document.getElementById('jobsList').innerHTML = output;
  }

  function applyJobFromDashboard(jobId, candidateEmail) {
    fetch('http://localhost:8080/apply', {
      method:'POST',
      headers:{'Content-Type':'application/x-www-form-urlencoded'},
      body:`jobId=${jobId}&email=${encodeURIComponent(candidateEmail)}`
    })
    .then(res => res.text())
    .then(data => {
      if (data === 'Applied Successfully') {
        alert('✅ Applied successfully!');
        loadMyApplications();
      } else {
        alert('⚠️ Could not apply. You may have already applied for this job.');
      }
    })
    .catch(err => alert('Error: ' + err));
  }

  function loadMyApplications() {
    const email = sessionStorage.getItem('email');
    fetch(`http://localhost:8080/my-applications?email=${encodeURIComponent(email)}`)
    .then(res => res.json())
    .then(data => {
      if (data.length === 0) {
        document.getElementById('applicationsList').innerHTML = `
          <div class="empty-state"><div class="empty-icon">📋</div><p>You haven't applied for any jobs yet.</p></div>`;
        return;
      }
      let output = '';
      data.forEach(app => {
        let statusClass = 'status-pending';
        if (app.status === 'ACCEPTED') statusClass = 'status-accepted';
        else if (app.status === 'REJECTED') statusClass = 'status-rejected';
        output += `
          <div class="application-item">
            <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px;">
              <div>
                <h3>${app.job}</h3>
                <p><span class="card-label">Company</span> ${app.company}</p>
                <p><span class="card-label">Applied</span> ${new Date(app.appliedAt).toLocaleDateString()}</p>
              </div>
              <span class="status-badge ${statusClass}">${app.status}</span>
            </div>
          </div>`;
      });
      document.getElementById('applicationsList').innerHTML = output;
    })
    .catch(() => {
      document.getElementById('applicationsList').innerHTML = '<p style="color:#fca5a5;">Error loading applications.</p>';
    });
  }

  function loadMyResumes() {
    const email = sessionStorage.getItem('email');
    fetch(`http://localhost:8080/resumes?email=${encodeURIComponent(email)}`)
    .then(res => res.json())
    .then(data => {
      if (data.length === 0) {
        document.getElementById('resumesList').innerHTML = `
          <div class="empty-state"><div class="empty-icon">📄</div><p>No resumes uploaded yet.</p></div>`;
        return;
      }
      let output = '';
      data.forEach(resume => {
        const primaryBadge = resume.isPrimary ? '<span class="primary-badge">✓ Primary</span>' : '';
        const setPrimaryBtn = !resume.isPrimary
          ? `<button class="btn-ghost btn-sm" onclick="setPrimaryResume(${resume.id})">Set as Primary</button>`
          : '';
        output += `
          <div class="resume-item">
            <div class="resume-info">
              <h3>📄 ${resume.fileName} ${primaryBadge}</h3>
              <p>${(resume.fileSize / 1024).toFixed(2)} KB · Uploaded ${new Date(resume.uploadedAt).toLocaleDateString()}</p>
            </div>
            <div class="resume-buttons">
              <button class="btn-secondary btn-sm" onclick="downloadResume(${resume.id})">⬇ Download</button>
              ${setPrimaryBtn}
              <button class="btn-danger btn-sm" onclick="deleteResumeFile(${resume.id})">🗑 Delete</button>
            </div>
          </div>`;
      });
      document.getElementById('resumesList').innerHTML = output;
    })
    .catch(() => {
      document.getElementById('resumesList').innerHTML = '<p style="color:#fca5a5;">Error loading resumes.</p>';
    });
  }

  function uploadResume() {
    const fileInput = document.getElementById('resumeFile');
    const file = fileInput.files[0];
    const email = sessionStorage.getItem('email');
    if (!file) { alert('Please select a file first.'); return; }

    const formData = new FormData();
    formData.append('email', email);
    formData.append('file', file);

    fetch('http://localhost:8080/upload-resume', { method:'POST', body:formData })
    .then(res => res.text())
    .then(data => {
      if (data.includes('successfully')) {
        alert('✅ Resume uploaded successfully!');
        fileInput.value = '';
        loadMyResumes();
      } else {
        alert('❌ Failed to upload resume.');
      }
    })
    .catch(err => alert('Error: ' + err));
  }

  function downloadResume(resumeId) {
    window.open(`http://localhost:8080/download-resume?id=${resumeId}`, '_blank');
  }

  function setPrimaryResume(resumeId) {
    const email = sessionStorage.getItem('email');
    fetch('http://localhost:8080/set-primary-resume', {
      method:'POST',
      headers:{'Content-Type':'application/x-www-form-urlencoded'},
      body:`resumeId=${resumeId}&email=${encodeURIComponent(email)}`
    })
    .then(res => res.text())
    .then(data => {
      if (data.includes('set')) { alert('✅ Primary resume updated!'); loadMyResumes(); }
      else { alert('❌ Failed to update primary resume.'); }
    })
    .catch(err => alert('Error: ' + err));
  }

  function deleteResumeFile(resumeId) {
    if (confirm('Are you sure you want to delete this resume?')) {
      alert('Delete feature coming soon.');
    }
  }

  function logout() {
    sessionStorage.clear();
    window.location.href = 'login.html';
  }
</script>
</body>
</html>
