<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browse Jobs — JobPortal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar">
  <div class="navbar-brand"><span class="dot"></span> JobPortal</div>
  <div class="navbar-links" id="navLinks">
    <a href="index.html">Home</a>
    <a href="login.html" class="btn-nav-cta">Login</a>
  </div>
</nav>

<div class="container-wide">
  <div class="page-header dashboard-header">
    <div>
      <h2>Available Jobs</h2>
      <p class="text-muted small-text">Find your next opportunity</p>
    </div>
    <button onclick="loadJobs()" class="btn-secondary">Refresh</button>
  </div>

  <div id="jobList">
    <div class="empty-state">
      <div class="empty-icon">💼</div>
      <p>Loading jobs...</p>
    </div>
  </div>
</div>

<script src="script.js"></script>
<script>
  // Adjust navbar based on session
  const email = sessionStorage.getItem('email');
  const role  = sessionStorage.getItem('role');
  const nav   = document.getElementById('navLinks');
  if (email && role) {
    const dest = role === 'RECRUITER' ? 'recruiter-dashboard.html' : 'candidate-dashboard.html';
    nav.innerHTML = `
      <a href="index.html">Home</a>
      <span class="text-muted small-text">${email}</span>
      <a href="${dest}" class="btn-nav-cta">Dashboard</a>
      <button class="logout-btn" onclick="logout()">Logout</button>`;
  } else {
    nav.innerHTML = `
      <a href="index.html">Home</a>
      <a href="login.html">Login</a>
      <a href="register.html" class="btn-nav-cta">Get Started</a>`;
  }
  window.addEventListener('load', loadJobs);
</script>
</body>
</html>
