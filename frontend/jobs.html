<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browse Jobs — JobPortal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="layout">
  <nav class="sidebar" id="sidebar"></nav>
  <main class="main">
    <div class="topbar">
      <div class="topbar-left">
        <button class="mobile-menu-btn" id="mobileMenuBtn">☰</button>
        <div class="topbar-title">
          <h1>Browse Jobs</h1>
          <p>Find your next opportunity across Bangladesh</p>
        </div>
      </div>
      <div class="topbar-actions">
        <button class="btn-secondary btn-sm" onclick="loadJobs()">↺ Refresh</button>
      </div>
    </div>

    <div class="filter-bar">
      <input type="text"   id="searchKeyword"   placeholder="Title, skill or company…">
      <input type="text"   id="filterLocation"  placeholder="Location">
      <input type="number" id="filterMinSalary" placeholder="Min salary (৳)">
      <input type="number" id="filterMaxSalary" placeholder="Max salary (৳)">
      <div class="filter-actions" style="grid-column:1/-1">
        <button onclick="searchJobs()">Search</button>
        <button class="btn-secondary" onclick="resetSearch()">Reset</button>
      </div>
    </div>

    <div id="jobList"></div>
  </main>
</div>
<script src="script.js"></script>
<script>
  buildSidebar('jobs');
  window.addEventListener('load',()=>{
    const p=getQueryParams();
    if(p.keyword)   document.getElementById('searchKeyword').value=p.keyword;
    if(p.location)  document.getElementById('filterLocation').value=p.location;
    if(p.minSalary) document.getElementById('filterMinSalary').value=p.minSalary;
    if(p.maxSalary) document.getElementById('filterMaxSalary').value=p.maxSalary;
    loadJobs(Object.values(p).some(Boolean)?p:{});
  });
  document.addEventListener('keydown',e=>{if(e.key==='Enter'&&document.activeElement?.closest('.filter-bar'))searchJobs();});
</script>
</body>
</html>
