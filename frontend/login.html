<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — JobPortal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
<div class="auth-layout">
  <div class="auth-sidebar" id="sidebar"></div>
  <div class="auth-content">
    <div class="auth-card">
      <h2>Welcome back</h2>
      <p class="auth-sub">Sign in to continue to your dashboard</p>
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="email" placeholder="you@example.com" autocomplete="email">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="Your password" autocomplete="current-password">
      </div>
      <button class="btn-full" onclick="login()">Sign In</button>
      <div class="auth-footer">New here? <a href="register.html" class="auth-link">Create an account</a></div>
    </div>
  </div>
</div>
<script src="script.js"></script>
<script>
  buildSidebar('login');
  const u=getUser();
  if(u.email&&u.role) location.href=u.role==='RECRUITER'?'recruiter-dashboard.html':'candidate-dashboard.html';
  document.addEventListener('keydown',e=>{if(e.key==='Enter')login();});
</script>
</body>
</html>
