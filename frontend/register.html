<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — JobPortal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar">
  <div class="navbar-brand"><span class="dot"></span> JobPortal</div>
  <button id="navbarToggle" class="navbar-toggle" aria-label="Open navigation">
    <span></span>
    <span></span>
    <span></span>
  </button>
  <div class="navbar-links" id="navLinks"></div>
</nav>

<div class="container">
  <div class="top-strip">
    <p>Search the latest jobs in Bangladesh and apply with a single click.</p>
    <div class="top-strip-links">
      <a href="login.html">Login</a>
      <a href="register.html">Register</a>
    </div>
  </div>
  <div class="section-heading">
    <h2>Create Account</h2>
    <p class="text-muted small-text">Join thousands of candidates and recruiters</p>
  </div>

  <div class="form-group">
    <label for="name">Full Name</label>
    <input type="text" id="name" placeholder="John Doe" autocomplete="name">
  </div>

  <div class="form-group">
    <label for="email">Email Address</label>
    <input type="email" id="email" placeholder="you@example.com" autocomplete="email">
  </div>

  <div class="form-group">
    <label for="password">Password</label>
    <input type="password" id="password" placeholder="Min. 6 characters" autocomplete="new-password">
  </div>

  <div class="form-group">
    <label for="role">I am a...</label>
    <select id="role">
      <option value="CANDIDATE">Job Candidate</option>
      <option value="RECRUITER">Recruiter / Employer</option>
    </select>
  </div>

  <button onclick="register()">Create My Account</button>

  <div class="text-center mt-20">
    <p class="text-muted small-text">Already have an account? <a href="login.html" class="link-secondary">Login here</a></p>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
