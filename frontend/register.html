<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — JobPortal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
<div class="auth-layout">
  <div class="auth-sidebar" id="sidebar"></div>
  <div class="auth-content">
    <div class="auth-card">
      <h2>Create Account</h2>
      <p class="auth-sub">Join thousands of candidates and recruiters</p>
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="name" placeholder="Your full name" autocomplete="name">
      </div>
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="email" placeholder="you@example.com" autocomplete="email">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="Min. 6 characters" autocomplete="new-password">
      </div>
      <div class="form-group">
        <label>I am a…</label>
        <select id="role">
          <option value="CANDIDATE">Job Candidate</option>
          <option value="RECRUITER">Recruiter / Employer</option>
        </select>
      </div>
      <button class="btn-full" onclick="register()">Create Account</button>
      <div class="auth-footer">Have an account? <a href="login.html" class="auth-link">Sign in</a></div>
    </div>
  </div>
</div>
<script src="script.js"></script>
<script>buildSidebar('register');</script>
</body>
</html>
