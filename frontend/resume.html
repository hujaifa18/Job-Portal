<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Resume — JobPortal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar">
  <div class="navbar-brand"><span class="dot"></span> JobPortal</div>
  <div class="navbar-links">
    <a href="index.html">Home</a>
    <a href="jobs.html">Browse Jobs</a>
    <a href="login.html" class="btn-nav-cta">Login</a>
  </div>
</nav>

<div class="container">
  <div class="section-heading">
    <h2>📄 My Resume</h2>
    <p class="text-muted small-text">Upload and manage your resume files</p>
  </div>

  <!-- Upload Box -->
  <div class="upload-box" id="uploadBox">
    <div class="upload-icon">📤</div>
    <p><strong>Click to upload or drag & drop your resume</strong></p>
    <p class="text-muted small-text" style="margin-top:6px;">PDF files only · Max 5MB</p>
    <input type="file" id="fileInput" class="file-input" accept=".pdf">
  </div>

  <!-- Progress Bar -->
  <div class="progress-bar" id="progressBar" style="display:none;">
    <div class="progress-fill" id="progressFill"></div>
  </div>

  <!-- Message -->
  <div id="message" style="display:none;"></div>

  <!-- Resume List -->
  <div class="file-list">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;">
      <h3>Your Resumes</h3>
      <button onclick="loadResumes()" class="btn-secondary btn-sm">🔄 Refresh</button>
    </div>
    <div id="resumeList" class="resume-list"></div>
  </div>

  <div class="divider"></div>
  <a href="jobs.html" class="nav-button">← Back to Jobs</a>
</div>

<script>
  const uploadBox  = document.getElementById('uploadBox');
  const fileInput  = document.getElementById('fileInput');
  const progressBar  = document.getElementById('progressBar');
  const progressFill = document.getElementById('progressFill');
  const message = document.getElementById('message');

  uploadBox.addEventListener('click', () => fileInput.click());

  uploadBox.addEventListener('dragover', (e) => {
    e.preventDefault();
    uploadBox.classList.add('dragover');
  });
  uploadBox.addEventListener('dragleave', () => uploadBox.classList.remove('dragover'));
  uploadBox.addEventListener('drop', (e) => {
    e.preventDefault();
    uploadBox.classList.remove('dragover');
    const files = e.dataTransfer.files;
    if (files.length > 0) { fileInput.files = files; uploadResume(); }
  });

  fileInput.addEventListener('change', uploadResume);

  function uploadResume() {
    const file = fileInput.files[0];
    if (!file) return;

    if (!file.name.toLowerCase().endsWith('.pdf')) {
      showMessage('Please upload a PDF file only.', 'error'); return;
    }
    if (file.size > 5 * 1024 * 1024) {
      showMessage('File size must be less than 5MB.', 'error'); return;
    }

    const formData = new FormData();
    formData.append('email', sessionStorage.getItem('email') || '');
    formData.append('file', file);

    progressBar.style.display = 'block';
    progressFill.style.width = '30%';

    fetch('http://localhost:8080/upload-resume', { method:'POST', body:formData })
    .then(res => res.text())
    .then(data => {
      progressFill.style.width = '100%';
      setTimeout(() => {
        progressBar.style.display = 'none';
        progressFill.style.width = '0%';
        showMessage('✅ Resume uploaded successfully!', 'success');
        fileInput.value = '';
        loadResumes();
      }, 500);
    })
    .catch(error => {
      progressBar.style.display = 'none';
      showMessage('❌ Error uploading: ' + error.message, 'error');
    });
  }

  function loadResumes() {
    const email = sessionStorage.getItem('email');
    if (!email) { showMessage('Please login first to view resumes.', 'error'); return; }

    fetch('http://localhost:8080/resumes?email=' + encodeURIComponent(email))
    .then(res => res.json())
    .then(data => {
      let html = '';
      if (data.length === 0) {
        html = `<div class="empty-state"><div class="empty-icon">📄</div><p>No resumes uploaded yet.</p></div>`;
      } else {
        data.forEach(resume => {
          const primaryBadge = resume.isPrimary ? '<span class="primary-badge">✓ Primary</span>' : '';
          const setPrimaryBtn = !resume.isPrimary
            ? `<button class="btn-ghost btn-sm" onclick="setAsDefault(${resume.id})">Set as Primary</button>`
            : '';
          html += `
            <div class="file-item">
              <div class="file-info">
                <div class="file-name">📄 ${resume.fileName} ${primaryBadge}</div>
                <div class="file-size">${(resume.fileSize / 1024).toFixed(2)} KB · Uploaded ${new Date(resume.uploadedAt).toLocaleDateString()}</div>
              </div>
              <div class="file-actions">
                <button class="btn-secondary btn-sm" onclick="downloadResume(${resume.id})">⬇ Download</button>
                ${setPrimaryBtn}
              </div>
            </div>`;
        });
      }
      document.getElementById('resumeList').innerHTML = html;
    })
    .catch(() => {
      document.getElementById('resumeList').innerHTML = '<p style="color:#fca5a5;">Error loading resumes.</p>';
    });
  }

  function setAsDefault(resumeId) {
    fetch('http://localhost:8080/set-primary-resume', {
      method:'POST',
      headers:{'Content-Type':'application/x-www-form-urlencoded'},
      body:'resumeId=' + resumeId + '&email=' + encodeURIComponent(sessionStorage.getItem('email') || '')
    })
    .then(res => res.text())
    .then(() => { showMessage('✅ Primary resume updated!', 'success'); loadResumes(); })
    .catch(err => showMessage('❌ Error: ' + err.message, 'error'));
  }

  function downloadResume(resumeId) {
    window.open('http://localhost:8080/download-resume?id=' + resumeId, '_blank');
  }

  function showMessage(text, type) {
    message.textContent = text;
    message.className = 'alert alert-' + (type === 'error' ? 'error' : 'success');
    message.style.display = 'flex';
    setTimeout(() => { message.style.display = 'none'; }, 4000);
  }

  window.addEventListener('load', () => {
    if (sessionStorage.getItem('email')) loadResumes();
  });
</script>
</body>
</html>
