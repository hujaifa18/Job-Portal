<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Resume — JobPortal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="layout">
  <nav class="sidebar" id="sidebar"></nav>
  <main class="main">
    <div class="topbar">
      <div class="topbar-left">
        <button class="mobile-menu-btn" id="mobileMenuBtn">☰</button>
        <div class="topbar-title">
          <h1>My Resume</h1>
          <p>Upload and manage your CV files</p>
        </div>
      </div>
    </div>

    <div class="upload-zone" id="uploadZone" onclick="document.getElementById('fileInput').click()">
      <div class="upload-zone-icon">📤</div>
      <p style="font-weight:600;margin-bottom:4px;color:var(--t1)">Click to upload or drag & drop</p>
      <p class="text-sm text-muted">PDF files only · Max 5MB</p>
      <input type="file" id="fileInput" accept=".pdf" style="display:none">
    </div>

    <div class="section-head">
      <div><h2>Uploaded Resumes</h2></div>
      <button class="btn-secondary btn-sm" onclick="loadResumes()">↺ Refresh</button>
    </div>
    <div id="resumeList"></div>
  </main>
</div>
<script src="script.js"></script>
<script>
  buildSidebar('resume');
  const _u=getUser();
  if(!_u.email||_u.role!=='CANDIDATE') location.href='login.html';

  document.addEventListener('DOMContentLoaded',loadResumes);

  const zone=document.getElementById('uploadZone');
  const inp =document.getElementById('fileInput');
  inp.addEventListener('change',()=>{if(inp.files[0])doUpload(inp.files[0]);});
  zone.addEventListener('dragover',e=>{e.preventDefault();zone.style.borderColor='var(--gold)';});
  zone.addEventListener('dragleave',()=>zone.style.borderColor='');
  zone.addEventListener('drop',e=>{e.preventDefault();zone.style.borderColor='';if(e.dataTransfer.files[0])doUpload(e.dataTransfer.files[0]);});

  function doUpload(file){
    if(!file.name.toLowerCase().endsWith('.pdf')) return toast('PDF files only.','error');
    if(file.size>5*1024*1024) return toast('Max file size is 5MB.','error');
    const fd=new FormData(); fd.append('email',_u.email); fd.append('file',file);
    apiFetch('/upload-resume',{method:'POST',body:fd}).then(parseResp)
      .then(d=>{toast(d?.message||d?.error||'Upload failed.',d?.message?'success':'error');if(d?.message){inp.value='';loadResumes();}})
      .catch(()=>toast('Upload failed.','error'));
  }

  function loadResumes(){
    const c=document.getElementById('resumeList');
    showLoading(c);
    apiFetch(`/resumes?email=${enc(_u.email)}`).then(parseResp).then(data=>{
      if(!data.length){c.innerHTML=empty('📄','No resumes uploaded yet.');return;}
      c.innerHTML=data.map(r=>`
        <div class="resume-row">
          <div class="resume-icon">📄</div>
          <div class="resume-info">
            <h3>${esc(r.fileName)} ${r.isPrimary?'<span class="badge badge-gold">Primary</span>':''}</h3>
            <p>${(r.fileSize/1024).toFixed(1)} KB · Uploaded ${new Date(r.uploadedAt).toLocaleDateString()}</p>
          </div>
          <div class="resume-actions">
            <button class="btn-secondary btn-sm" onclick="apiUrl('/download-resume?id=${r.id}').then(u=>window.open(u,'_blank'))">Download</button>
            ${!r.isPrimary?`<button class="btn-ghost btn-sm" onclick="setPrimary(${r.id})">Set Primary</button>`:''}
            <button class="btn-danger btn-sm" onclick="delResume(${r.id})">Delete</button>
          </div>
        </div>`).join('');
    }).catch(()=>{c.innerHTML=empty('⚠️','Error loading resumes.');});
  }

  function setPrimary(id){
    apiFetch('/set-primary-resume',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:`resumeId=${id}&email=${enc(_u.email)}`})
      .then(parseResp).then(d=>{if(d?.message)loadResumes();else toast(d?.error||'Failed.','error');}).catch(()=>toast('Failed.','error'));
  }
  function delResume(id){
    if(!confirm('Delete this resume?'))return;
    apiFetch('/delete-resume',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:`resumeId=${id}&email=${enc(_u.email)}`})
      .then(parseResp).then(d=>{if(d?.message)loadResumes();else toast(d?.error||'Failed.','error');}).catch(()=>toast('Failed.','error'));
  }
</script>
</body>
</html>
